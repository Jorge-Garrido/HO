[project]
name = "validador"
version = "0.2.0"
description = "Validador de consistencia de documentos de facturación en salud"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]
ocr = ["rapidocr>=3.9", "onnxruntime>=1.20"]

[project.scripts]
validador = "validador.execute.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["datos_reales: pruebas que usan la carpeta nuevaeps/ local (se omiten si no existe)"]
